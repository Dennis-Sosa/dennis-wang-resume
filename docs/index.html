<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dennis Yutong Wang — AI Data Engineer and Product Manager. Find my GitHub and LinkedIn profiles.">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Dennis Yutong Wang</title>
  <style>
    :root { color-scheme: light; --paper:#f8f7f4; --ink:#242724; --muted:#666b65; --line:#dddeda; --accent:#aa483b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; line-height:1.6; }
    a { color:inherit; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:5px; }
    .skip { position:absolute; left:16px; top:-100px; padding:8px 14px; background:#fff; z-index:2; }
    .skip:focus { top:12px; }
    .shell { width:min(100% - 48px,820px); margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:30px 0; border-bottom:1px solid var(--line); }
    .wordmark { font-size:16px; font-weight:750; letter-spacing:-.04em; }
    .header-label { color:var(--muted); font-size:12px; letter-spacing:.13em; text-transform:uppercase; }
    main { padding:76px 0 72px; }
    .avatar { position:relative; display:grid; place-items:center; width:86px; height:86px; margin-bottom:28px; border-radius:50%; background:#e9e6df; color:var(--muted); font-size:24px; font-weight:650; overflow:hidden; }
    .avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .eyebrow { margin:0 0 14px; color:var(--accent); font-size:12px; font-weight:650; letter-spacing:.16em; text-transform:uppercase; }
    h1 { max-width:720px; margin:0; font-size:clamp(38px,7.5vw,64px); font-weight:650; letter-spacing:-.055em; line-height:1.1; text-wrap:balance; }
    .bio { margin:22px 0 0; font-size:clamp(16px,2.4vw,20px); color:var(--muted); }
    .divider { display:inline-block; padding:0 8px; color:#a6aaa3; }
    .section-heading { margin:52px 0 16px; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .links { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .link-card { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:24px; border:1px solid var(--line); border-radius:14px; background:#fff; text-decoration:none; transition:border-color .16s ease,transform .16s ease; }
    .link-card:hover { border-color:var(--accent); transform:translateY(-2px); }
    .link-title { display:block; font-size:18px; font-weight:650; letter-spacing:-.02em; }
    .link-detail { display:block; margin-top:3px; color:var(--muted); font-size:13px; }
    .arrow { font-size:25px; color:var(--accent); }
    footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:23px 0 32px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .domain { overflow-wrap:anywhere; }
    @media(max-width:560px) {
      .shell { width:calc(100% - 36px); }
      header { padding:23px 0; }
      main { padding:46px 0 44px; }
      .links { grid-template-columns:1fr; }
      .section-heading { margin-top:36px; }
      .link-card { padding:20px; }
      .bio span { display:block; }
      .bio .divider { display:none; }
    }
    @media(prefers-reduced-motion:reduce) {
      .link-card { transition:none; }
      .link-card:hover { transform:none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header>
      <span class="wordmark">DW.</span>
      <span class="header-label">Personal website</span>
    </header>
    <main id="main">
      <!-- Public GitHub avatar; replace this URL with a local image to customize. -->
      <div class="avatar">
        <span aria-hidden="true">DW</span>
        <img src="https://avatars.githubusercontent.com/u/228614792?v=4" alt="GitHub profile avatar" width="86" height="86" decoding="async" onerror="this.hidden=true">
      </div>
      <!-- Edit the name and professional description below. -->
      <p class="eyebrow">Welcome to my corner of the web</p>
      <h1>Dennis Yutong Wang</h1>
      <p class="bio"><span>AI Data Engineer</span><span class="divider" aria-hidden="true">|</span><span>Product Manager</span></p>
      <h2 class="section-heading">Find me online</h2>
      <!-- These are existing public profiles, not placeholder links. -->
      <nav class="links" aria-label="Professional profiles">
        <a class="link-card" href="https://www.linkedin.com/in/yutong-wang-6043b4380/" target="_blank" rel="noopener noreferrer">
          <span><span class="link-title">LinkedIn</span><span class="link-detail">Connect with me</span></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link-card" href="https://github.com/Dennis-Sosa" target="_blank" rel="noopener noreferrer">
          <span><span class="link-title">GitHub</span><span class="link-detail">Explore my code and projects</span></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
    <footer>
      <span>Dennis Yutong Wang</span>
      <span class="domain">dennisyutongwang.com</span>
    </footer>
  </div>
</body>
</html>
